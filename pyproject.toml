[project]
name = "disputeshield-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "anthropic", "pypdf"]

[dependency-groups]
dev = ["pytest", "mypy", "hypothesis", "respx", "fpdf2"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
